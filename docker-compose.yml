services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apartment_marketplace
    ports:
      - "5432:5432"
    volumes:
      - apartment_marketplace_pgdata:/var/lib/postgresql/data

volumes:
  apartment_marketplace_pgdata:
